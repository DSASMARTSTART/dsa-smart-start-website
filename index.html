    <!-- i18n: set <html lang> early from localStorage -->
    <script>
      (function() {
        try {
          var lng = localStorage.getItem('i18nextLng');
          if (lng) document.documentElement.lang = lng.substring(0, 2);
        } catch (_) { /* Storage can be blocked in private browsers. */ }
      })();
    </script>

    <!-- Alternate language links -->
    <script>
      // Establish the API connection while page code downloads, only on routes
      // that need it. This performs no data request or authentication operation.
      (function() {
        if (!/^#(?:courses|syllabus-|ebook-|live-course-|viewer-|dashboard|checkout|live-learning|teacher-calendar|admin|login|reset-password)/.test(location.hash) &&
            !new URLSearchParams(location.search).has('code') &&
            !new URLSearchParams(location.search).has('auth')) return;
        try {
          var api = new URL('%VITE_SUPABASE_URL%');
          if (api.protocol !== 'https:' && api.protocol !== 'http:') return;
          var link = document.createElement('link');
          link.rel = 'preconnect';
          link.href = api.origin;
          link.crossOrigin = 'anonymous';
          document.head.appendChild(link);
        } catch (_) { /* Unconfigured local builds still render normally. */ }
      })();
    </script>

    <script>
      (function() {
        var messages = { en: ['Loading…', 'Reload page'], it: ['Caricamento…', 'Ricarica la pagina'], sr: ['Učitavanje…', 'Ponovo učitaj stranicu'], es: ['Cargando…', 'Recargar página'] };
        var text = messages[document.documentElement.lang] || messages.en;
        document.getElementById('startup-message').textContent = text[0];
        document.getElementById('startup-retry').textContent = text[1];
        setTimeout(function() {
          var retry = document.getElementById('startup-retry');
          if (retry) retry.hidden = false;
        }, 10000);

    </script>
